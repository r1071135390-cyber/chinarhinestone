<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" role="img" aria-label="ChinaRhinestone — Custom Heat Transfer Manufacturer">
  <defs>
    <linearGradient id="cr-hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Hexagon CR icon -->
  <g transform="translate(4 4)">
    <polygon points="28,2 52,16 52,44 28,58 4,44 4,16" fill="url(#cr-hex)"/>
    <polygon points="28,10 44,19 44,41 28,50 12,41 12,19" fill="#0b1220" opacity="0.25"/>
    <text x="28" y="38" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="24" font-weight="900" fill="#ffffff" letter-spacing="-1">CR</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(76 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="0" y="40" font-size="28" font-weight="900" fill="#0f172a" letter-spacing="-0.5">China</text>
    <text x="86" y="40" font-size="28" font-weight="900" fill="#1d4ed8" letter-spacing="-0.5">Rhinestone</text>
    <text x="0" y="56" font-size="9" font-weight="700" fill="#475569" letter-spacing="2.4">CUSTOM HEAT TRANSFER MANUFACTURER</text>
  </g>
</svg>
