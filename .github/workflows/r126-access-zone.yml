name: R126 zone probe - locate the zone behind sublimapparel.com

on:
  push:
    branches:
      - "r126/access-zone"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Probe zone ownership and Access app scope
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node r126/access/probe-zone.mjs
