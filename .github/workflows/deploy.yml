name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # Build with Next.js static export. The output goes to ./out/ which
      # the Pages deploy step uploads directly. We use static export because
      # the previous Workers (OpenNext SSR) build hit the 10ms CPU limit on
      # the free plan and returned "worker exceeded resource limit". The
      # site is fully static content — no SSR / cookies / headers needed —
      # so serving plain HTML from the edge cache is the right fit.
      - name: Build with Next.js static export
        run: npx next build

      # Check the build size before uploading. Cloudflare Pages free plan
      # caps a single deployment at 25 MiB (any single file). If the build
      # ever exceeds this, the deploy step below will fail and this size
      # log will tell us which folder is too heavy.
      - name: Check build size
        run: |
          echo "Build size by top-level entry under out:"
          du -sh out/* 2>/dev/null | sort -hr || true
          echo
          echo "Total out size:"
          du -sh out 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name chinarhinestone --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
