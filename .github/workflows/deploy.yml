name: Deploy to Cloudflare Pages (GitHub Integration build)

on:
  # Auto-deploy on every push to main
  push:
    branches:
      - main
  # Manual trigger from the Actions tab (still works)
  workflow_dispatch:

jobs:
  # Verify build only. CF Pages GitHub Integration does the actual deploy.
  # We intentionally do NOT call `wrangler pages deploy` here — it conflicts
  # with the project's GitHub Integration mode (pushes an _worker.js in
  # a format CF Pages silently ignores, leaving /api/* 404'd).
  #
  # The Cloudflare GitHub App installs its own deploy check run on every
  # push (see Check Runs on the commit), which runs the configured
  # Build command + Build output directory on the dashboard:
  #
  #   Build command:         npm run build
  #   Build output directory: out
  #   Root directory:        (project root)
  #
  # That dashboard build runs `next build` (the `build` script), which
  # fires `postbuild` and copies cf-functions-src/ → out/functions/ via
  # scripts/copy-functions.mjs. The CF Pages build pipeline then bundles
  # out/functions/ into _worker.js automatically using its built-in
  # pages-functions-build tool. No wrangler invocation needed on our side.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build (dry-run via npm run build)
        # Runs the same build the CF Pages dashboard build will run, so
        # any compile/import error fails fast here instead of producing
        # a 404 on prod.
        #
        # `npm run build` (not `npx next build`) so the `postbuild` hook
        # runs and copy-functions.mjs populates out/functions/.
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "--- Top-level entries under out/ ---"
          ls -la out | head -50
          echo
          echo "--- Functions at project root (CF Pages reads from here) ---"
          if [ -d functions ]; then
            echo "functions/ exists at project root"
            ls functions
            ls functions/api 2>/dev/null || echo "no functions/api"
            echo
            echo "--- _routes.json (copied to build output root by postbuild) ---"
            cat out/_routes.json || echo "no out/_routes.json"
            echo
            echo "--- Build size ---"
            du -sh out 2>/dev/null || true
            du -sh out/* 2>/dev/null | sort -hr | head -10 || true
          else
            echo "ERROR: functions/ missing from project root — CF Pages build pipeline cannot bundle _worker.js"
            exit 1
          fi
