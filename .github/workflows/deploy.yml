name: Deploy to Cloudflare Pages

on:
  # Auto-deploy on every push to main
  push:
    branches:
      - main
  # Manual trigger from the Actions tab (still works)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # Build with Next.js static export. The output goes to ./out/ which
      # the Pages deploy step uploads directly. We use static export because
      # the previous Workers (OpenNext SSR) build hit the 10ms CPU limit on
      # the free plan and returned "worker exceeded resource limit". The
      # site is fully static content — no SSR / cookies / headers needed —
      # so serving plain HTML from the edge cache is the right fit.
      - name: Build with Next.js static export
        # Use `npm run build` (not `npx next build`) so the `postbuild`
        # hook runs. The postbuild regenerates sitemap.xml from the
        # rendered HTML in out/ — Next.js's default sitemap is built at
        # prerender time and would otherwise ship stale lastmod values.
        run: npm run build

      # Check the build size before uploading. Cloudflare Pages free plan
      # caps a single deployment at 25 MiB (any single file). If the build
      # ever exceeds this, the deploy step below will fail and this size
      # log will tell us which folder is too heavy.
      - name: Check build size
        run: |
          echo "Build size by top-level entry under out:"
          du -sh out/* 2>/dev/null | sort -hr || true
          echo
          echo "Total out size:"
          du -sh out 2>/dev/null || true

      - name: Pre-build Functions worker
        # Compile out/functions/* into out/_worker.js locally so we can see
        # build errors in the GH Actions log instead of discovering them
        # after deploy. We use --outdir (NOT --outfile) — the latter emits
        # a wrangler-internal multipart/form-data blob that CF Pages
        # silently ignores, so /api/* falls through to Next.js's static
        # 404.html. --outdir produces a plain ES module index.js, which is
        # what CF Pages' Pages Functions runtime actually executes.
        run: |
          echo "=== out/functions/ contents ==="
          ls -la out/functions/
          echo
          echo "=== Building _worker.js ==="
          rm -f out/_worker.js
          wrangler_build_dir=$(mktemp -d)
          npx wrangler pages functions build out/functions \
            --outdir "$wrangler_build_dir" \
            --compatibility-date 2025-06-01 \
            --compatibility-flag nodejs_compat \
            --external stripe \
            --external "@supabase/supabase-js" || {
              echo "::warning::wrangler pages functions build failed — /api/* will fall back to Next.js static 404.html"
              exit 0
            }
          echo "=== build artifacts ==="
          ls -la "$wrangler_build_dir"
          # Copy the plain ES module main entry into out/_worker.js so
          # wrangler pages deploy --no-bundle picks it up. (--outdir names
          # the entry 'index.js'; --outfile names it '_worker.js'.)
          cp "$wrangler_build_dir/index.js" out/_worker.js
          echo "=== out/_worker.js head ==="
          head -n 5 out/_worker.js
          echo "=== out/_worker.js tail ==="
          tail -n 5 out/_worker.js
          echo "=== out/_worker.js size ==="
          ls -la out/_worker.js

      - name: Deploy to Cloudflare Pages
        # Direct wrangler invocation (not the wrangler-action wrapper) so
        # that all stderr/stdout stream into the GH Actions log. The
        # wrangler-action wrapper swallows the inner wrangler error and
        # only shows a generic "exit code 1" — which made the original
        # 'Invalid access token [code: 9109]' impossible to diagnose.
        #
        # No --no-bundle: wrangler pages deploy auto-bundles out/functions/
        # into _worker.js on its own. Pre-bundling here (--outfile) plus
        # --no-bundle uploads a multipart _worker.js that CF Pages silently
        # ignores — /api/* then falls through to the Next.js 404.html.
        #
        # cf-functions-src/ is copied into out/functions/ by the postbuild
        # hook (scripts/copy-functions.mjs). The copy skips node_modules so
        # wrangler's bundler doesn't choke on @supabase/phoenix .d.ts files.
        #
        # Required GitHub repo secrets:
        #   CLOUDFLARE_API_TOKEN  — Cloudflare API token with "Cloudflare
        #                            Pages: Edit" permission for this account.
        #   CLOUDFLARE_ACCOUNT_ID — Account ID (hex).
        run: npx wrangler pages deploy out --project-name=chinarhinestone --branch=main 2>&1 | tee /tmp/wrangler-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Surface wrangler deploy error
        if: failure()
        run: |
          echo "::group::wrangler deploy output (tail)"
          tail -n 80 /tmp/wrangler-deploy.log 2>/dev/null || echo "no log captured"
          echo "::endgroup::"
          echo "::error::wrangler pages deploy failed — see group above for the actual Cloudflare error message"
