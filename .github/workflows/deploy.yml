name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Build with OpenNext for Cloudflare. The output goes to .open-next/
      # which the Pages deploy step uploads directly. The previous Workers
      # build (wrangler deploy) hit the 10ms CPU limit on the free plan and
      # the request would fail with "worker exceeded resource limit". Pages
      # serves static assets from the edge cache and only invokes a function
      # for true dynamic routes, so we stay within the free plan.
      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build

      # Check the build size before uploading. Cloudflare Pages free plan
      # caps a single deployment at 25 MiB (any single file). If the build
      # ever exceeds this, the deploy step below will fail and this size
      # log will tell us which folder is too heavy.
      - name: Check build size
        run: |
          echo "Build size by top-level entry under .open-next:"
          du -sh .open-next/* 2>/dev/null | sort -hr || true
          echo
          echo "Total .open-next size:"
          du -sh .open-next 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .open-next --project-name chinarhinestone --commit-dirty=true --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
