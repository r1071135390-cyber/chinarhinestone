name: Deploy to Cloudflare Pages

on:
  # Auto-deploy on every push to main
  push:
    branches:
      - main
  # Manual trigger from the Actions tab (still works)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # Build with Next.js static export. The output goes to ./out/ which
      # the Pages deploy step uploads directly. We use static export because
      # the previous Workers (OpenNext SSR) build hit the 10ms CPU limit on
      # the free plan and returned "worker exceeded resource limit". The
      # site is fully static content — no SSR / cookies / headers needed —
      # so serving plain HTML from the edge cache is the right fit.
      - name: Build with Next.js static export
        # Use `npm run build` (not `npx next build`) so the `postbuild`
        # hook runs. The postbuild regenerates sitemap.xml from the
        # rendered HTML in out/ — Next.js's default sitemap is built at
        # prerender time and would otherwise ship stale lastmod values.
        run: npm run build

      # Check the build size before uploading. Cloudflare Pages free plan
      # caps a single deployment at 25 MiB (any single file). If the build
      # ever exceeds this, the deploy step below will fail and this size
      # log will tell us which folder is too heavy.
      - name: Check build size
        run: |
          echo "Build size by top-level entry under out:"
          du -sh out/* 2>/dev/null | sort -hr || true
          echo
          echo "Total out size:"
          du -sh out 2>/dev/null || true

      - name: Pre-build Functions worker (debug)
        # Compile cf-functions-src/functions into out/_worker.js locally
        # so we can see build errors right here in the GH Actions log
        # instead of discovering them after deploy.
        # NOTE: This overwrites any _worker.js that `wrangler pages deploy`
        # would otherwise auto-generate. The deploy step will use this one.
        run: |
          echo "=== out/functions/ contents ==="
          ls -la out/functions/
          echo
          echo "=== Building _worker.js ==="
          # wrangler pages functions build needs --external for any npm
          # packages we import (stripe, @supabase/supabase-js) so esbuild
          # doesn't try to bundle their transitive deps (e.g. @supabase/
          # phoenix ships .d.ts files that esbuild trips on). Runtime
          # resolves them via nodejs_compat.
          # NOTE: do NOT npm install into out/functions/node_modules —
          # wrangler's bundler recursively scans that dir and chokes on
          # those .d.ts files even with --external.
          npx wrangler pages functions build out/functions \
            --outfile out/_worker.js \
            --build-output-directory out \
            --output-routes-path out/_routes.json \
            --compatibility-date 2025-06-01 \
            --compatibility-flag nodejs_compat \
            --external stripe \
            --external "@supabase/supabase-js" || \
            echo "::warning::wrangler pages functions build failed — deploy will fall back to Next.js static 404.html for /api/*"
          echo
          echo "=== out/_worker.js size (if any) ==="
          ls -la out/_worker.js 2>/dev/null || echo "no _worker.js was generated"

      - name: Deploy to Cloudflare Pages
        # Direct wrangler invocation (not the wrangler-action wrapper) so
        # that all stderr/stdout stream into the GH Actions log. The
        # wrangler-action wrapper swallows the inner wrangler error and
        # only shows a generic "exit code 1" — which made the original
        # 'Invalid access token [code: 9109]' impossible to diagnose.
        #
        # The token is passed via env so it doesn't leak into process
        # listings. `npx wrangler` resolves to the wrangler already in
        # devDependencies (wrangler@^4) — no separate install needed.
        #
        # Required GitHub repo secrets:
        #   CLOUDFLARE_API_TOKEN  — Cloudflare API token with "Cloudflare
        #                            Pages: Edit" permission for this account.
        #                            Generate at:
        #                            https://dash.cloudflare.com/profile/api-tokens
        #   CLOUDFLARE_ACCOUNT_ID — Account ID (hex), shown on the
        #                            Cloudflare Dashboard right sidebar.
        #
        # Cloudflare Pages checks the project-level
        # `production_deployments_enabled` setting for the branch matching
        # `production_branch` (default: main). If that toggle is OFF, every
        # production deployment gets skipped with:
        #   "The deployment was skipped because production deployments are
        #   disabled for this project."
        # If you see that skip message, flip "Enable production deployments"
        # back ON in the dashboard. It is a SEPARATE toggle from the git
        # auto-deploy one — leaving git auto-deploy off does NOT bypass the
        # production gate.
        run: npx wrangler pages deploy out --project-name=chinarhinestone --branch=main --no-bundle 2>&1 | tee /tmp/wrangler-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # If wrangler exits non-zero, attach its tail as a job-level error
        # annotation so the actual Cloudflare error is visible without
        # needing to click into the log.
      - name: Surface wrangler deploy error
        if: failure()
        run: |
          echo "::group::wrangler deploy output (tail)"
          tail -n 80 /tmp/wrangler-deploy.log 2>/dev/null || echo "no log captured"
          echo "::endgroup::"
          echo "::error::wrangler pages deploy failed — see group above for the actual Cloudflare error message"
