name: Deploy to Cloudflare Pages

on:
  # Auto-deploy on every push to main
  push:
    branches:
      - main
  # Manual trigger from the Actions tab (still works)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # Build with Next.js static export. The output goes to ./out/ which
      # the Pages deploy step uploads directly. We use static export because
      # the previous Workers (OpenNext SSR) build hit the 10ms CPU limit on
      # the free plan and returned "worker exceeded resource limit". The
      # site is fully static content — no SSR / cookies / headers needed —
      # so serving plain HTML from the edge cache is the right fit.
      - name: Build with Next.js static export
        # Use `npm run build` (not `npx next build`) so the `postbuild`
        # hook runs. The postbuild regenerates sitemap.xml from the
        # rendered HTML in out/ — Next.js's default sitemap is built at
        # prerender time and would otherwise ship stale lastmod values.
        run: npm run build

      # Check the build size before uploading. Cloudflare Pages free plan
      # caps a single deployment at 25 MiB (any single file). If the build
      # ever exceeds this, the deploy step below will fail and this size
      # log will tell us which folder is too heavy.
      - name: Check build size
        run: |
          echo "Build size by top-level entry under out:"
          du -sh out/* 2>/dev/null | sort -hr || true
          echo
          echo "Total out size:"
          du -sh out 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        # We use the official cloudflare/pages-action direct-upload path
        # because the project's git auto-deploy is intentionally disabled
        # (see Cloudflare Dashboard → Settings → Builds & deployments →
        # "Enable automatic deployments on push"). GitHub Actions is the
        # only trigger.
        #
        # Required GitHub repo secrets:
        #   CLOUDFLARE_API_TOKEN  — Cloudflare API token with "Cloudflare
        #                            Pages: Edit" permission for this account.
        #                            Generate at:
        #                            https://dash.cloudflare.com/profile/api-tokens
        #   CLOUDFLARE_ACCOUNT_ID — Account ID (hex), shown on the
        #                            Cloudflare Dashboard right sidebar.
        #
        # `--branch` is the deployment alias and source-branch metadata.
        # Cloudflare Pages checks the project-level
        # `production_deployments_enabled` setting for the branch matching
        # `production_branch` (default: main). If that toggle is OFF, every
        # production deployment gets skipped with:
        #   "The deployment was skipped because production deployments are
        #   disabled for this project."
        # If you see that skip message, flip "Enable production deployments"
        # back ON in the dashboard. It is a SEPARATE toggle from the git
        # auto-deploy one — leaving git auto-deploy off does NOT bypass the
        # production gate.
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chinarhinestone
          directory: out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
