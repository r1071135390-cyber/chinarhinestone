name: R126 Access app - protect *.pages.dev/administered

on:
  push:
    branches:
      - "r126/access-app"
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = dry run, create = actually create the Access app"
        required: true
        default: "probe"
        type: choice
        options:
          - probe
          - create

permissions:
  contents: read

jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Provision the account-level Access application
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R126_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'probe' }}
        run: |
          set -euo pipefail
          node r126/access/create-access-app.mjs
