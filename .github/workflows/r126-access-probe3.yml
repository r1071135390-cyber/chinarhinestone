name: R126 probe3 - definitive Access/token boundary probe

on:
  push:
    branches:
      - "r126/access-probe3"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Probe Cloudflare Access boundary and token permissions
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node r126/access/probe-access-scope3.mjs
