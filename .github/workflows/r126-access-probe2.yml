name: R126 probe2 - refined Access scope/permission probe

on:
  push:
    branches:
      - "r126/access-probe2"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Probe Cloudflare Access scope and write permissions
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node r126/access/probe-access-scope2.mjs
