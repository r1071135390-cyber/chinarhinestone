name: R125 restore - put the wiped Pages secrets back and redeploy

on:
  push:
    branches:
      - "r125/restore-secrets"

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore secrets on the sublimapparel Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COZE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN_SETUP }}
        run: node r125/restore/restore.mjs
